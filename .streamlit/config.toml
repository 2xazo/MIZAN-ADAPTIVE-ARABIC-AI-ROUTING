[theme]
base = "dark"
primaryColor = "#D0F94A"
backgroundColor = "#0B2E30"
secondaryBackgroundColor = "#083C46"
textColor = "#FFFFFF"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Minimal toolbar. A browser profile may still show Streamlit's educational prompt once; it is dismissed by hand, not hidden with CSS.
toolbarMode = "minimal"
showSidebarNavigation = false
