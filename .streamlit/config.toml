[theme]
base = "dark"
primaryColor = "#C6F23A"
backgroundColor = "#0B2E30"
secondaryBackgroundColor = "#12474B"
textColor = "#FFFFFF"

[browser]
gatherUsageStats = false

[client]
# Minimal toolbar. A browser profile may still show Streamlit's educational prompt once; it is dismissed by hand, not hidden with CSS.
toolbarMode = "minimal"
showSidebarNavigation = false
